name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q Foco.zip
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: Foco
      - uses: actions/upload-artifact@v4
        with:
          name: Foco-apk
          path: Foco/app/build/outputs/apk/debug/app-debug.apk
